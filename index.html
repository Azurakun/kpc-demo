<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surat Suara Pemilihan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="ballot-header">
            <div class="logo">🗳️</div>
            <h1>SURAT SUARA</h1>
            <h2>PEMILIHAN KUWU DADAP</h2>
            <p>KECAMATAN JUNTINYUAT<br>KABUPATEN INDRAMAYU<br>TAHUN 2025</p>
        </header>

        <main>
            <div class="candidate-grid" id="candidate-grid">
                </div>
        </main>

        <footer>
            <button class="submit-button" id="submit-selection" disabled>
                Pilih Kandidat Ini
            </button>
        </footer>
    </div>

    <div id="confirmation-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header-text">
                <h2>Konfirmasi Pemilihan</h2>
                <p>Apa Anda yakin akan memilih kandidat ini?</p>
            </div>
            <div id="modal-candidate-info" class="modal-candidate">
                </div>
            <div class="modal-actions">
                <button id="modal-back-btn" class="modal-btn-back">Ulangi</button>
                <button id="modal-confirm-btn" class="modal-btn-confirm">Pilih</button>
            </div>
        </div>
    </div>

    <div id="thank-you-modal" class="modal-overlay">
        <div class="thank-you-content">
            <div class="thank-you-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#4CAF50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            </div>
            <h3>Terima Kasih</h3>
            <p>Suara berhasil dikirim dan tersimpan.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
